# Runtime definition for the EC2 instance. Synced to /opt/app/ on every
# deploy and driven with: docker compose --env-file deploy.env ...
# deploy.env (non-secret) provides ECR_IMAGE and DUCKDNS_HOST; the api
# service's secrets land in /opt/app/.env, rendered from SSM by render-env.sh.
services:
  api:
    image: ${ECR_IMAGE}
    env_file: /opt/app/.env
    # Non-secret runtime flag: enforce Firebase App Check on /api requests.
    # Set here (not in SSM) so it's version-controlled; `environment` overrides
    # env_file, and this key isn't in /opt/app/.env so there's no conflict.
    environment:
      - APP_CHECK_ENFORCED=true
    restart: unless-stopped
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    # Docker's json-file driver keeps everything forever unless told otherwise,
    # and this box is a t4g.micro with a 20GB volume — an unbounded log grows
    # until the disk fills, at which point Postgres connections, Docker and the
    # API fail together. 30MB ceiling per service. Pairs with the redaction in
    # server/src/lib/http.ts: that bounds what gets written, this bounds how
    # long it lives, and user data shouldn't accumulate on disk indefinitely
    # either way.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DUCKDNS_HOST=${DUCKDNS_HOST}
    volumes:
      - /opt/app/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    # Lower volume than the API (no access log is configured), but it shares
    # the same disk and the same unbounded default.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
