name: CI

on:
  push:
    branches: [main]
  pull_request:
  # An advisory can land against dependencies that haven't changed, so the
  # audit job below needs a heartbeat that isn't a code push. The deploy jobs
  # are gated on `push` and skip on this trigger.
  schedule:
    - cron: "0 11 * * 1" # Mondays, after Dependabot has opened its PRs

# Read-only by default. `id-token: write` is what lets a job mint the OIDC
# token that assumes the AWS deploy role, and the token's `sub` claim names
# only the repo and ref — not the job. Granted workflow-wide, a compromised
# action in the test or audit jobs would produce a token AWS cannot tell apart
# from a real deploy's. The two deploy jobs opt in individually instead.
permissions:
  contents: read

# KEEP IN SYNC with infra/env.sh ($APP-derived names and region).
env:
  AWS_REGION: us-east-2
  ECR_REPO: jobtracker-api
  LAMBDA_FUNCTION: jobtracker-reminders

jobs:
  server:
    name: Server (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm test

  client:
    name: Client (lint + typecheck + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      # Lint, typecheck, and tests never evaluate the PostCSS/Tailwind pipeline,
      # so a broken CSS config passes all three. Only a build catches it: the
      # Tailwind v4 bump (#7) was green here while `next build` failed outright.
      #
      # Placeholders, not secrets. Prerendering evaluates the Firebase SDK at
      # module scope, and getAuth() throws auth/invalid-api-key on an undefined
      # key — so the build needs *some* value. Nothing contacts Firebase at
      # build time, and NEXT_PUBLIC_* are inlined into the browser bundle
      # anyway, so real credentials would buy nothing here. This output is
      # never deployed; Vercel builds the client with the real values.
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:0:web:0"

  lambda:
    name: Lambda (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lambda
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lambda/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  audit:
    name: Dependency audit (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # one package's advisory shouldn't hide another's
      matrix:
        package: [server, client, lambda]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      # Reads the lockfile directly — no install needed.
      - run: npm audit --audit-level=high
        working-directory: ${{ matrix.package }}

  deploy-api:
    name: Deploy API to EC2
    # Deliberately not gated on `audit`: an advisory published against an
    # untouched dependency must not block shipping an unrelated fix. It goes
    # red, you see it, you merge the Dependabot PR.
    needs: [server, client, lambda]
    # Deploys only from main, and only once the infra exists (repo variables set).
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.INSTANCE_ID != '' && vars.DEPLOY_ROLE_ARN != ''
    # arm runner: the image must be arm64 to run on the t4g instance.
    runs-on: ubuntu-24.04-arm
    permissions:
      id-token: write # only here and in deploy-lambda — see the note up top
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2
      - name: Build and push image
        run: |
          IMAGE="${{ vars.ECR_REGISTRY }}/${{ env.ECR_REPO }}"
          docker build --platform linux/arm64 \
            -t "$IMAGE:${GITHUB_SHA}" -t "$IMAGE:latest" server/
          docker push "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:latest"
      - name: Deploy on instance via SSM
        run: |
          # Repo variables can carry stray whitespace from copy-paste; a space
          # inside --instance-ids reaches IAM as part of the resource ARN and
          # fails authorization opaquely.
          INSTANCE_ID="$(echo '${{ vars.INSTANCE_ID }}' | tr -d '[:space:]')"
          b64() { base64 -w0 "$1"; }
          cat > commands.json <<EOF
          {
            "commands": [
              "set -euo pipefail",
              "mkdir -p /opt/app",
              "echo '$(b64 deploy/docker-compose.yml)' | base64 -d > /opt/app/docker-compose.yml",
              "echo '$(b64 deploy/Caddyfile)' | base64 -d > /opt/app/Caddyfile",
              "echo '$(b64 deploy/render-env.sh)' | base64 -d > /opt/app/render-env.sh",
              "echo '$(b64 deploy/on-instance-deploy.sh)' | base64 -d > /opt/app/on-instance-deploy.sh",
              "chmod +x /opt/app/render-env.sh /opt/app/on-instance-deploy.sh",
              "cd /opt/app && ./on-instance-deploy.sh"
            ]
          }
          EOF
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --timeout-seconds 600 \
            --parameters file://commands.json \
            --query "Command.CommandId" --output text)
          echo "Command: $CMD_ID"
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo Pending)
            echo "[$i] $STATUS"
            case "$STATUS" in
              Success) break ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation --command-id "$CMD_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "StandardErrorContent" --output text
                exit 1 ;;
            esac
            if [ "$i" = 60 ]; then echo "Timed out waiting for deploy"; exit 1; fi
            sleep 10
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" --output text
      - name: Smoke test
        run: curl -fsS --retry 5 --retry-delay 5 "https://${{ vars.DUCKDNS_HOST }}/health"

  deploy-lambda:
    name: Deploy reminder Lambda
    needs: [server, client, lambda]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      id-token: write # only here and in deploy-api — see the note up top
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lambda/package-lock.json
      - name: Build bundle
        working-directory: lambda
        run: |
          npm ci
          node build.mjs
          zip -j function.zip dist/index.js
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Update function code
        working-directory: lambda
        run: |
          if ! aws lambda get-function --function-name "$LAMBDA_FUNCTION" >/dev/null 2>&1; then
            echo "Function not provisioned yet (infra/09-lambda.sh) — skipping."
            exit 0
          fi
          aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION" \
            --zip-file fileb://function.zip
